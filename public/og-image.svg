<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1327;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="1000" cy="100" r="200" fill="rgba(29, 78, 216, 0.1)"/>
  <circle cx="200" cy="500" r="250" fill="rgba(59, 130, 246, 0.08)"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="1180" height="610" fill="none" stroke="#1D4ED8" stroke-width="4"/>
  
  <!-- App Name -->
  <text x="600" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="90" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Infinity Note
  </text>
  
  <!-- Infinity Symbol -->
  <text x="600" y="340" font-family="Arial" font-size="100" font-weight="bold" fill="#3B82F6" text-anchor="middle">
    ∞
  </text>
  
  <!-- Tagline -->
  <text x="600" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="40" fill="#94a3b8" text-anchor="middle">
    Free Online Note Taking App
  </text>
  
  <!-- Features -->
  <text x="600" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#cbd5e1" text-anchor="middle">
    ✨ Unlimited Notes  |  🏷️ Categories  |  ☁️ Cloud Sync  |  📱 Mobile Friendly
  </text>
  
  <!-- URL -->
  <text x="600" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#1D4ED8" text-anchor="middle">
    infinity-note.vercel.app
  </text>
</svg>
