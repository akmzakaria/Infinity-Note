<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Infinity Note</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #0c1327;
        color: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        text-align: center;
        max-width: 400px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 16px;
        color: #38bdf8;
      }
      p {
        font-size: 16px;
        line-height: 1.6;
        color: #cbd5e1;
        margin-bottom: 24px;
      }
      button {
        background-color: #1d4ed8;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      button:hover {
        background-color: #1e40af;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Your notes are still available in
        offline mode.
      </p>
      <button onclick="window.location.href = '/?category=All'">Go to Notes</button>
    </div>
  </body>
</html>
